name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 9.1.1 + Gradle 9.3.1 + compileSdk 36 need a modern JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships the Android SDK with platform 36.
      - name: Build debug APK
        id: build
        run: |
          {
            echo "=== environment ==="
            java -version 2>&1 | head -2
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1 | head -20
            echo "=== gradle ==="
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode=summary
            echo "=== searching for produced apk ==="
            find app/build/outputs -name "*.apk" -print 2>&1
            mkdir -p dist
            find app/build/outputs -name "*.apk" -exec cp {} dist/app-debug.apk \;
            echo "=== dist ==="
            ls -la dist/ 2>&1
          } 2>&1 | tee build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnipdf-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Attach APK to a Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omnipdf-${{ github.run_number }}
          name: OmniPDF build ${{ github.run_number }}
          body: Automatic debug build of ${{ github.sha }}
          files: dist/app-debug.apk
          fail_on_unmatched_files: false

      - name: Publish build log
        if: always()
        run: |
          mkdir -p ci-logs
          cp build.log "ci-logs/build-${{ github.run_number }}.log" || echo "no build.log produced" > "ci-logs/build-${{ github.run_number }}.log"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A ci-logs
          if git diff --cached --quiet; then
            echo "log unchanged, nothing to publish"
          else
            git commit -m "ci: build log ${{ github.run_number }} [skip ci]"
            git push
          fi